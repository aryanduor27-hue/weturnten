<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>10 Years of Us</title>
<style>
:root{--bg:#fff5f2;--card:#fff;--ink:#3b2230;--mut:#8a6577;--acc:#e0446a;--q:#ffe3ea;--bd:#f2cfd8}
@media(prefers-color-scheme:dark){:root{--bg:#1b1118;--card:#27171f;--ink:#f7e6ec;--mut:#c49bad;--acc:#ff6b8f;--q:#3d1f2b;--bd:#4a2a38}}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,-apple-system,Segoe UI,sans-serif;display:flex;flex-direction:column;align-items:center;overflow-x:hidden}
.bar{width:100%;height:5px;background:var(--bd)}.bar i{display:block;height:100%;width:0;background:var(--acc);transition:width .4s}
.top{width:100%;max-width:680px;display:flex;justify-content:space-between;align-items:center;padding:10px 16px;font-size:13px;color:var(--mut)}
.top select{font:inherit;color:var(--mut);background:none;border:1px solid var(--bd);border-radius:20px;padding:4px 12px;cursor:pointer;max-width:55vw}
main{flex:1;width:100%;max-width:680px;padding:0 16px;overflow-y:auto}
.card{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:22px;animation:in .45s}
@keyframes in{from{opacity:0;transform:translateY(14px)}}
.ch{color:var(--acc);font-size:12px;letter-spacing:.15em;text-transform:uppercase}
h1{font:700 28px/1.2 Georgia,serif;margin:4px 0 14px}
.ph{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.ph div{border-radius:14px;overflow:hidden;background:var(--q)}
.ph img{width:100%;height:100%;object-fit:contain;display:block}
p.t{margin:0 0 16px;white-space:pre-wrap}
blockquote{margin:0 0 16px;padding:16px 18px;background:var(--q);border-left:5px solid var(--acc);border-radius:12px;font:italic 19px/1.45 Georgia,serif}
.roast{width:100%;text-align:left;background:none;border:1px dashed var(--mut);border-radius:12px;padding:10px 14px;color:var(--mut);font:inherit;cursor:pointer}
.roast.on{border-style:solid;color:var(--ink);background:var(--card)}
.nav{width:100%;max-width:680px;display:flex;gap:10px;padding:12px 16px 16px}
.nav button{flex:1;padding:13px;font:600 16px system-ui,sans-serif;border-radius:14px;border:1px solid var(--bd);background:var(--card);color:var(--ink);cursor:pointer}
.nav .n{background:var(--acc);color:#fff;border-color:var(--acc)}.nav button:disabled{opacity:.35}
.h{position:fixed;top:-30px;animation:f linear forwards;pointer-events:none;z-index:9}
@keyframes f{to{transform:translateY(110vh) rotate(360deg)}}
</style></head><body>
<div class="bar"><i id="pg"></i></div>
<div class="top"><span id="cnt"></span><select id="jump" aria-label="Jump to page"></select></div>
<main><div class="card" id="card"></div></main>
<div class="nav"><button id="pv">← Back</button><button id="nx" class="n">Next →</button></div>
<script>
/* =====================================================================
   HOW TO CUSTOMISE (all offline, no internet needed)
   1. Make a folder, put this file in it, and create a sub-folder "images".
   2. Put your photos in "images" (e.g. images/1.jpeg, images/2.jpeg ...).
   3. Edit the list below. Each page is:
        [ "Title", "Text", "Highlighted quote", "Banter line", ["images/1.jpeg", "images/1b.jpeg"] ]
      - Add as many photos as you like inside the last [ ] (or leave it [] for none).
      - A photo that can't be found is simply hidden, so nothing looks broken.
   4. Double-click the file to open it in any browser. Done!
   ===================================================================== */
const P=[
["Ten Years. Yes, Ten.","Hey Yogiiiiii. Before you panic, no, this isn’t a bill. It’s a tiny website I built because a card felt too small for ten years of you.","Ten years and you still haven’t blocked me. Respect.","I built this entire thing myself, so please be impressed.",["images/1.jpeg"]],
["The Day We Met","Areee Yogita, tumhara baal pakk gya h kya??","Some people walk into your life and just rearrange all the furniture.","I remember it perfectly. Mostly. Okay, you remember it better.",["images/2.jpeg"]],
["First Impressions","Phli baar to bas itna sa laga ki WOWWWWWWWWW BHAGWAANNN!!! Kya Masttt cheez bnai h!!","I thought, ‘Oh no. She’s way out of my league.’ Ten years later, still true.","My first impression was ‘nice.’ Yours was probably ‘who is this guy.’",["images/3.jpeg"]],
["Our Friendship","Muskan Di bhale kaisi bhi ho, hm dono ko milwa k kaam to bahut punya ka ki hn.","You made me laugh before I’d even figured out how to talk to you.","I was nervous. You were not. Unfair.",["images/4.jpeg"]],
["The First Date","\"Nahiii ye date nhi h, ye to bas meet up h\". Still remember Shemford and chhota golu. US DIN KA PHOTO HI NHI HHHHHH AAAAAAA","Best date of my life, and I still don’t know how we manage to pull that off in Begusarai.","Fun fact, I rehearsed my jokes. Half of them landed.",["images/5.jpeg"]],
["Bus Seat Fixation","\"Oye yahan koi nhi baithega, ye seat first stoppage se booked h!!!\"","Somewhere between your laugh and your terrible taste in music, I was done for.","Your taste in music is still terrible. I stayed anyway.",["images/6.jpeg"]],
["Best Friend","3 Chocolate de k best friend bna li, itne saste mn kon nipta deta h??","Turns out we’re better at making up than at arguing.","I was right. Moving on.",["images/7.jpeg"]],
["Thanks to Bunny Di","Teachers day pr bunny di k bahane se jo number share hua h hmara, MASTER PLAN!!","Jab aap kisi cheez ko poori shiddat se chaho to aapki khadoos bahan bhi aapko usse milwane ki saazish mn jut hi jati hai.","Yes, she is khadoos and so are you hehhe.",["images/8.jpeg"]],
["MHART Days","\"aaj na boht sarr dukh rha h aaj nhi aayenge.\" Aai hoti to usi din propose kr dete","That day I seriously realised, how important you have become in my life.","And the importance grew at a rate of 6%, compounded daily.",["images/9.jpeg"]],
["Our Joke","\"Aaj gadda aur chakka khaye.\" ","Nobody else gets it, and that’s exactly why it’s ours.", "If you’re reading this, you’re already laughing. I win.",["images/10.jpeg"]],
["Proposal","\"Pta h yogi, I am in love with someone, you can see her in mirror.\"","I LOVE YOU YOGIII!!!!" ,"\"NOOOOOOOOOOO\"",["images/11.jpeg"]],
["Hard Times","Dil tod ke hansti ho mera?? Wafayein meri yaad karogi","Chaar se phle teen aata hai, aur teen se phle do","I proposed a girl and she said NOOOOOOOOOO",["images/12.jpeg"]],
["The Happiest Diwali","Phir aaya Diwali k din mere jivan mn sabse subdar pataka. The best diwali I could ever ask for.","Love is mostly just showing up. You always did.","You also showed up with chocolates. Elite behaviour.",["images/13.jpeg"]],
["Things I Love About You","Hardest thing is to list all of that in a few words, but the biggest reason I love you soooo much is ki everything in you is just completing me and vice versa.","It’s never the big things. It’s how you fits perfectly in my incomplete puzzle","There’s a longer list of things that annoy me. This isn’t that page.",["images/14.jpeg"]],
["Things You Do That Drive Me Crazy","When I see the love for me in your eyes, when you comfort me like a baby, when you annoy me knowing I am being annoyed, all of it drives me crazy(yamak alankar), even today.","You’re the only person I’d happily be annoyed by forever.","Yes, the thing with the lights off. You know the thing.",["images/15.jpeg"]],
["Varanasi Trips","From ghats to mandir, from blue lassi to bati chokha, from BHU campus to Rajdari, I am in love with banaras because I am in love with you!!","Good food, better company, and you still stealing my food.","‘I’m not hungry,’ she said, eating half my plate.",["images/16.jpeg"]],
["Our Little Routines","Good Morning, Lunch??, Dinner??, kkrh??, Thappad wala sticker(one-sided), I love it all....and will always.","The ordinary days with you are my favourite ones.","Our most intense argument is still why I am the bad guy?",["images/17.jpeg"]],
["Bangalore and Pondi Chapter","For the first time in that city I felt happy and complete.","Still remember every good moment of that trip.","I know you remember all the bad ones too hehe.",["images/18.jpeg"]],
["Patna Trip","Toooo courageous for us to meet in a place like patna, bhagwan na kren phir kbhi hm dono patna mn milen hahaha.","BTW I’m proud of you in ways I don’t say out loud enough.","I’m saying it now, so screenshot this.",["images/19.jpeg"]],
["How You’ve Changed Me","Honestly, I am a better person and I think you have a great role to play in this. You made badmos ladka Aryan to a man Aryan","I’m a better version of myself because you believed in me first.","Not much better, but we work with what we have.",["images/20.jpeg"]],
["Begusarai Meetups","Milte milte kab 2 se 3 ho gye pata hi nhi chla. (talking about Golu chill...)","ek aadh hi restaurant bacha h explore krna.","Jldi jldi kr hi lete hn(mere non-veg partner ko bhi lete aana)",["images/21.jpeg"]],
["Things I Never Say Enough","Over the years there has been many ups and downs along the path, but we have grown so beautifully together and I am really proud of you and what we are today. May we grow like this forever","Tu hai to dil dhadakta hai, tu hai to saansein aati hai...", "Okay, I’m getting emotional. Eyes are fine. It’s the dust.",["images/22.jpeg"]],
["My Promises","Ten years in, here’s what I promise next.","Ten more years. Then ten more. Then we’ll negotiate.","Promise 1: I’ll try to know beforehand where I messed up. Try.",["images/23.jpeg"]],
["Dreams For Us","Where do you see yourselves in 10 years?","Wherever it is, I want the seat next to yours.(Bachon ko hostel bhej denge)","Lots of snacks. Loooong cuddle sessions. Many naps. Little cardio.",["images/24.jpeg"]],
["Happy 10th Anniversary ❤️","Ten years, countless memories, and I’d choose you in every single one. Thank you for being my best friend, my favourite person, my support system and my home.","I love you. Then, now, always.","Now tap the button below for your surprise.",["images/25.jpeg"]]
];
/* ===== end of editable area ===== */
const $=s=>document.querySelector(s);
let i=0,rev={};
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;");
function render(){
 const d=P[i];
 $("#cnt").textContent="Page "+(i+1)+" of "+P.length;
 $("#pg").style.width=((i+1)/P.length*100)+"%";
 $("#jump").value=i;$("#pv").disabled=i==0;
 $("#nx").textContent=i==P.length-1?"🎉 Surprise":"Next →";
 const c=$("#card");c.style.animation="none";c.offsetWidth;c.style.animation="";
 const ph=(d[4]||[]).map(p=>'<div><img src="'+esc(p)+'" alt="" onerror="this.parentNode.remove();chk()"></div>').join("");
 c.innerHTML='<div class="ch">Chapter '+(i+1)+'</div><h1>'+esc(d[0])+'</h1><div class="ph">'+ph+'</div><p class="t">'+esc(d[1])+'</p><blockquote>'+esc(d[2])+'</blockquote><button class="roast'+(rev[i]?" on":"")+'" id="ro">'+(rev[i]?esc(d[3]):"👀 Tap for banter")+'</button>';
 chk();
 $("#ro").onclick=()=>{rev[i]=!rev[i];render()};
 if(i==P.length-1)hearts(18);
 $("main").scrollTop=0;
}
function chk(){const p=$(".ph");if(p&&!p.children.length)p.remove()}
function hearts(n){for(let k=0;k<n;k++){const h=document.createElement("span");h.className="h";h.textContent=["❤️","💖","🎉","💕"][k%4];
 h.style.left=Math.random()*100+"vw";h.style.fontSize=(16+Math.random()*20)+"px";h.style.animationDuration=(3+Math.random()*3)+"s";h.style.animationDelay=Math.random()*1.5+"s";
 document.body.appendChild(h);setTimeout(()=>h.remove(),8000)}}
function go(n){i=Math.max(0,Math.min(P.length-1,n));render()}
$("#pv").onclick=()=>go(i-1);
$("#nx").onclick=()=>{if(i==P.length-1)hearts(40);else go(i+1)};
$("#jump").innerHTML=P.map((p,k)=>'<option value="'+k+'">'+(k+1)+'. '+esc(p[0].slice(0,22))+'</option>').join("");
$("#jump").onchange=e=>go(+e.target.value);
document.onkeydown=e=>{if(e.key=="ArrowRight")go(i+1);if(e.key=="ArrowLeft")go(i-1)};
render();
</script></body></html>
